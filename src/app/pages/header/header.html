<header>
    <div class="header-inner">
        <div class="logo">
            <a routerLink="/" class="logo-link">
                <strong>Iluminacion Blanco</strong>
            </a>
        </div>

        <nav>
            <div class="search-box">
                <img src="/images/Lupa.png" alt="Buscar" class="search-icon">
                <input type="text" placeholder="Buscar productos..." class="search-input" (keyup.enter)="onSearch($event)">
            </div>
            <ul #navContainer class="nav-desktop" *ngIf="!checkScreenSize()">
                <li *ngFor="let item of visibleItems">
                    <a [routerLink]="item.href" (click)="navigate(item.href, item.category)">{{item.label}}</a>
                </li>

                <!-- More dropdown when items overflow -->
                <li *ngIf="overflowItems.length" class="more">
                    <button class="more-btn">Más ▾</button>
                    <ul class="more-menu">
                        <li *ngFor="let it of overflowItems"><a [routerLink]="it.href" (click)="navigate(it.href, it.category)">{{it.label}}</a></li>
                    </ul>
                </li>
            </ul>
            <!-- Hidden measurement container -->
            <ul #measure class="measure-list" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;padding:0;margin:0;list-style:none;"></ul>
        </nav>
        
        <!-- Botón hamburguesa si la pantalla es muy pequeña -->
        <button class="menu-btn" (click)="toggleMenu()">☰</button>
    </div>
</header>

<!-- Sidebar -->
<div class="sidebar" [class.open]="menuOpen">
  <button class="close-btn" (click)="toggleMenu()">✕</button>

  <a routerLink="/" (click)="toggleMenu()">Inicio</a>
  <a routerLink="/products" (click)="selectCategory('Interior'); toggleMenu()">Interior</a>
  <a routerLink="/products" (click)="selectCategory('Exterior'); toggleMenu()">Exterior</a>
  <a routerLink="/servicios" (click)="toggleMenu()">Servicios</a>
  <a routerLink="/contact" (click)="toggleMenu()">Sobre nosotros</a>
</div>

<!-- Overlay para el fondo oscuro -->
<div class="overlay" [class.open]="menuOpen" (click)="toggleMenu()"></div>
