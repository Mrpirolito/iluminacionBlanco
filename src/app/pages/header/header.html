<header>
    <div class="header-inner">
        <div class="logo">
            <a routerLink="/" class="logo-link">
                <strong>Iluminacion Blanco</strong>
            </a>
            <p class="tagline">Desde 1970</p>
        </div>

        <!-- Buscador: lupa → expande input empujando el nav -->
        <div class="search-wrap" [class.open]="searchOpen">
            <button class="search-icon-btn" (click)="toggleSearch()" aria-label="Buscar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <div class="search-field">
                <input
                    #searchInputEl
                    type="text"
                    placeholder="Buscar productos..."
                    class="search-input"
                    (keyup.enter)="onSearch($event)"
                    (keyup.escape)="closeSearch()">
                <button class="search-close-btn" (click)="closeSearch()">✕</button>
            </div>
        </div>

        <nav>
            <ul #navContainer class="nav-desktop" *ngIf="!checkScreenSize()">
                <li *ngFor="let item of visibleItems">
                    <a [routerLink]="item.href" (click)="navigate(item.href, item.category)">{{item.label}}</a>
                </li>
                <li *ngIf="overflowItems.length" class="more">
                    <button class="more-btn">Más ▾</button>
                    <ul class="more-menu">
                        <li *ngFor="let it of overflowItems">
                            <a [routerLink]="it.href" (click)="navigate(it.href, it.category)">{{it.label}}</a>
                        </li>
                    </ul>
                </li>
            </ul>
            <ul #measure class="measure-list" aria-hidden="true"
                style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;padding:0;margin:0;list-style:none;"></ul>
        </nav>

        <!-- Toggle modo oscuro/claro — switch con sol/luna -->
        <button
            class="theme-toggle"
            [class.dark]="isDark"
            (click)="toggleTheme()"
            [attr.aria-label]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <span class="toggle-track">
                <span class="toggle-thumb">
                    <!-- Sol (modo claro) -->
                    <svg *ngIf="!isDark" width="14" height="14" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Luna (modo oscuro) -->
                    <svg *ngIf="isDark" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </span>
            </span>
        </button>

        <!-- Hamburguesa (móvil) -->
        <button class="menu-btn" (click)="toggleMenu()">☰</button>
    </div>
</header>

<!-- Sidebar -->
<div class="sidebar" [class.open]="menuOpen">
    <button class="close-btn" (click)="toggleMenu()">✕</button>
    <a routerLink="/" (click)="toggleMenu()">Inicio</a>
    <a routerLink="/products" (click)="selectCategory('Interior'); toggleMenu()">Interior</a>
    <a routerLink="/products" (click)="selectCategory('Exterior'); toggleMenu()">Exterior</a>
    <a routerLink="/servicios" (click)="toggleMenu()">Servicios</a>
    <a routerLink="/contact" (click)="toggleMenu()">Sobre nosotros</a>
</div>

<div class="overlay" [class.open]="menuOpen" (click)="toggleMenu()"></div>
