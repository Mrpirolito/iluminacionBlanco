<h1 style="padding-left: 20px;">Iluminación de Pared</h1>

<div class="productos-grid">
  <div class="producto" *ngFor="let p of productos" (click)="goToProductDetails(p.sys.id)"> 
    <div class="img-wrapper">
      <img [src]="'https:' + p.fields.productImage.fields.file.url" />
    </div>
    <h3>{{ p.fields.productName }}</h3>
  </div>
</div>
